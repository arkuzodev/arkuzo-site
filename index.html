  <script>
    // Discord: the main invite first; if Discord says it no longer exists, the fallback invite.
    // Checked only when the button is clicked, so visitors who don't click never contact Discord.
    (function () {
      var a = document.querySelector('.discord'); if (!a || !window.fetch) return;
      var fb = a.getAttribute('data-fallback'), main = a.getAttribute('href');
      function code(u) { return u.replace(/^https?:\/\/(discord\.gg|discord\.com\/invite)\//, '').replace(/[^A-Za-z0-9-]/g, ''); }
      var known = null;
      try { known = sessionStorage.getItem('arkuzo-invite'); } catch (e) { /* storage blocked */ }
      if (known) a.href = known;
      a.addEventListener('click', function (e) {
        if (known || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
        e.preventDefault();
        var done = false, go = function (url) {
          if (done) return; done = true; known = url; a.href = url;
          try { sessionStorage.setItem('arkuzo-invite', url); } catch (x) { /* storage blocked */ }
          window.open(url, '_blank', 'noopener');
        };
        setTimeout(function () { go(main); }, 2500);   // Discord slow or unreachable: the main invite
        fetch('https://discord.com/api/v10/invites/' + code(main), { credentials: 'omit', referrerPolicy: 'no-referrer' })
          .then(function (r) { go(r.status === 404 ? fb : main); })
          .catch(function () { go(main); });
      });
    })();
  </script>
